<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-192.png">
<title>📊 きろく</title>
<link rel="stylesheet" href="css/app.css">
<style>
  body{overflow:auto}
  main{flex:1;overflow-y:auto;padding:12px 12px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
  section h2{font-size:14px;color:var(--dim);margin-bottom:8px;letter-spacing:.06em}
  .players{display:flex;flex-wrap:wrap;gap:6px}
  .players button{padding:8px 12px;font-size:14px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{padding:8px 12px;font-size:13px;background:rgba(255,255,255,.08)}
  .tabs button.on{background:var(--gold);color:#1a1400}
  .best{display:flex;gap:10px;flex-wrap:wrap}
  .best .card{background:var(--panel);border-radius:12px;padding:10px 14px;min-width:120px}
  .best .card small{display:block;color:var(--dim);font-size:11px}
  .best .card b{font-size:22px;color:var(--gold)}
  .chart{width:100%;height:150px;background:var(--panel);border-radius:12px;display:block}
  .cap{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
  .cap input{width:70px;text-align:center}
</style>
</head>
<body>
<header>
  <a href="index.html">← メニュー</a>
  <h1>📊 きろく</h1>
  <button class="ghost" id="csvBtn" style="padding:8px 12px;font-size:13px">CSV</button>
</header>
<main>
  <section>
    <h2>選手</h2>
    <div class="players" id="players"></div>
    <div class="row" style="margin-top:8px"><button class="ghost" id="addBtn">＋ 選手を追加</button><button class="ghost" id="editBtn" hidden>✎ 名前・番号</button><button class="danger" id="delBtn" hidden>削除</button></div>
  </section>
  <section id="capSec" hidden>
    <div class="cap">1日のヘディング上限 <input type="number" id="capIn" min="0" max="200" inputmode="numeric"> 回（チームの方針に合わせて。目安: 小学生 10〜20 回）</div>
  </section>
  <section>
    <h2>種目</h2>
    <div class="tabs" id="tabs"></div>
  </section>
  <section>
    <div class="best" id="best"></div>
  </section>
  <section>
    <canvas class="chart" id="chart" width="600" height="150"></canvas>
  </section>
  <section>
    <h2>記録（新しい順）</h2>
    <div class="list" id="list"></div>
  </section>
  <p class="hint">記録はこの端末の中だけに保存されます。CSV で書き出すと Excel などで整理できます。映像は保存していません。</p>
</main>
<script src="js/records.js"></script>
<script src="js/common.js"></script>
<script>
(function () {
  'use strict';
  var R = window.TrainingRecords, $ = function (id) { return document.getElementById(id); };
  var pid = localStorage.getItem('trainingsystem.lastPlayer') || '';
  var kind = localStorage.getItem('ts.records.kind') || 'sprint10';
  function render() {
    var st = TS.store;
    if (pid && !R.playerById(st, pid)) pid = '';
    $('players').innerHTML = TS.players().map(function (p) {
      return '<button class="' + (p.id === pid ? 'on' : '') + '" data-id="' + p.id + '">' + (p.num ? '#' + p.num + ' ' : '') + TS.esc(p.name) + '</button>';
    }).join('') + '<button class="' + (pid ? '' : 'on') + '" data-id="">みんな</button>';
    $('players').querySelectorAll('button').forEach(function (b) { b.addEventListener('click', function () { pid = b.dataset.id; localStorage.setItem('trainingsystem.lastPlayer', pid); render(); }); });
    $('editBtn').hidden = $('delBtn').hidden = !pid;
    $('capSec').hidden = !pid;
    if (pid) $('capIn').value = R.playerById(st, pid).headingCap || 20;
    $('tabs').innerHTML = Object.keys(R.KINDS).map(function (k) { return '<button class="' + (k === kind ? 'on' : '') + '" data-k="' + k + '">' + R.KINDS[k].label + '</button>'; }).join('');
    $('tabs').querySelectorAll('button').forEach(function (b) { b.addEventListener('click', function () { kind = b.dataset.k; localStorage.setItem('ts.records.kind', kind); render(); }); });
    var K = R.KINDS[kind], rows = R.recordsOf(st, pid || null, kind);
    var cards = [];
    var best = pid ? R.best(st, pid, kind) : null;
    if (best) cards.push('<div class="card"><small>ベスト</small><b>' + R.fmtValue(kind, best.value) + '</b> ' + K.unit + '</div>');
    if (rows.length) {
      var avg = rows.slice(0, 5).reduce(function (s, r) { return s + r.value; }, 0) / Math.min(5, rows.length);
      cards.push('<div class="card"><small>直近5回の平均</small><b>' + R.fmtValue(kind, avg) + '</b> ' + K.unit + '</div>');
      cards.push('<div class="card"><small>回数</small><b>' + rows.length + '</b> 本</div>');
    }
    if (kind === 'heading' && pid) cards.push('<div class="card"><small>今日の合計</small><b>' + R.todayTotal(st, pid, 'heading') + '</b> 回</div>');
    $('best').innerHTML = cards.join('') || '<div class="hint">まだ記録がありません</div>';
    drawChart(rows.slice().reverse(), K);
    $('list').innerHTML = rows.slice(0, 100).map(function (r) {
      var p = R.playerById(st, r.playerId), d = new Date(r.at);
      var when = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2);
      return '<div class="item"><div class="n">' + (p ? TS.esc(p.name) : '選手なし') + '<small>' + when + '</small></div><div class="v">' + R.fmtValue(kind, r.value) + ' ' + K.unit + '</div><button class="x" data-id="' + r.id + '" aria-label="消す">×</button></div>';
    }).join('') || '<div class="hint">この種目の記録はありません</div>';
    $('list').querySelectorAll('.x').forEach(function (b) { b.addEventListener('click', function () { if (confirm('この記録を消しますか？')) { R.removeRecord(TS.store, b.dataset.id); TS.saveStore(); render(); } }); });
  }
  function drawChart(rows, K) {
    var c = $('chart'), g = c.getContext('2d');
    c.width = c.clientWidth * 2; c.height = 300;
    g.clearRect(0, 0, c.width, c.height);
    if (rows.length < 2) { g.fillStyle = 'rgba(255,255,255,.5)'; g.font = '24px sans-serif'; g.textAlign = 'center'; g.fillText('記録が2つ以上たまるとグラフが出ます', c.width / 2, c.height / 2 + 8); return; }
    var vals = rows.map(function (r) { return r.value; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (hi === lo) { hi += 1; lo -= 1; }
    var pad = 30, W = c.width - pad * 2, H = c.height - pad * 2;
    var X = function (i) { return pad + W * i / (rows.length - 1); }, Y = function (v) { return pad + H * (1 - (v - lo) / (hi - lo)); };
    g.strokeStyle = 'rgba(255,255,255,.15)'; g.lineWidth = 2;
    [lo, (lo + hi) / 2, hi].forEach(function (v) { g.beginPath(); g.moveTo(pad, Y(v)); g.lineTo(pad + W, Y(v)); g.stroke(); g.fillStyle = 'rgba(255,255,255,.6)'; g.font = '20px sans-serif'; g.textAlign = 'left'; g.fillText(R.fmtValue(kind, v), 4, Y(v) - 4); });
    g.strokeStyle = '#6EC6FF'; g.lineWidth = 4; g.beginPath();
    rows.forEach(function (r, i) { i ? g.lineTo(X(i), Y(r.value)) : g.moveTo(X(i), Y(r.value)); });
    g.stroke();
    var bestV = K.best === 'min' ? lo : K.best === 'max' ? hi : null;
    rows.forEach(function (r, i) { g.fillStyle = r.value === bestV ? '#FFD166' : '#fff'; g.beginPath(); g.arc(X(i), Y(r.value), 7, 0, Math.PI * 2); g.fill(); });
  }
  $('addBtn').addEventListener('click', function () {
    var name = prompt('選手の名前'); if (!name || !name.trim()) return;
    var num = prompt('背番号（なければ空でOK）') || '';
    var p = R.addPlayer(TS.store, name, num); if (!p) return;
    TS.saveStore(); pid = p.id; localStorage.setItem('trainingsystem.lastPlayer', pid); render();
  });
  $('editBtn').addEventListener('click', function () {
    var p = R.playerById(TS.store, pid); if (!p) return;
    var name = prompt('名前', p.name); if (name == null) return;
    var num = prompt('背番号', p.num); if (num == null) return;
    if (name.trim()) p.name = name.trim().slice(0, 20);
    p.num = String(num).replace(/[^0-9]/g, '').slice(0, 3);
    TS.saveStore(); render();
  });
  $('delBtn').addEventListener('click', function () {
    var p = R.playerById(TS.store, pid); if (!p) return;
    if (!confirm(p.name + ' を削除しますか？（記録もすべて消えます）')) return;
    R.removePlayer(TS.store, pid); TS.saveStore(); pid = ''; render();
  });
  $('capIn').addEventListener('change', function () {
    var p = R.playerById(TS.store, pid); if (!p) return;
    var v = parseInt($('capIn').value, 10);
    p.headingCap = v >= 0 && v <= 200 ? v : 20; TS.saveStore(); render();
  });
  $('csvBtn').addEventListener('click', function () {
    var d = new Date(), name = 'training_' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2) + '.csv';
    TS.downloadText(name, R.toCSV(TS.store));
  });
  render();
  TS.registerSW();
})();
</script>
</body>
</html>
